<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>محصولات</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

<h1 class="text-2xl font-bold mb-8 text-center">
  محصولات
</h1>

<div class="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">

  {% for p in products %}
  <div class="bg-white rounded-xl shadow overflow-hidden flex flex-col">

    {% if p.cover %}
      <img
  src="{{ url_for('static', path=p.cover) }}"
  class="w-full h-40 object-cover"
  alt="{{ p.name }}"
>

    {% else %}
      <div class="h-40 bg-gray-200 flex items-center justify-center">
        بدون تصویر
      </div>
    {% endif %}

    <div class="p-4 flex flex-col flex-1">
      <h2 class="font-bold text-lg mb-1">{{ p.name }}</h2>

      <p class="text-sm text-gray-600 mb-3">
        {{ p.description or "—" }}
      </p>

      <div class="mt-auto flex justify-between items-center">
        <span class="font-bold text-indigo-600">
          {{ "{:,}".format(p.price) }} تومان
        </span>

        <button
          onclick="buyProduct({{ p.id }}, this)"
          class="bg-indigo-600 hover:bg-indigo-700 items-center justify-center text-white px-4 py-2 rounded-lg">
          خرید
        </button>
      </div>
    </div>
  </div>
  {% endfor %}

</div>

<!-- Waiting Dialog -->
<div id="waitingDialog"
     class="fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center z-50">

  <div class="bg-white rounded-xl p-6 w-80 text-center">
    <!-- Spinner -->
    <div class="flex justify-center mb-4">
      <div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
    </div>

    <p id="waitingText" class="font-bold">
      لطفاً مبلغ را در دستگاه کارت‌خوان پرداخت کنید
    </p>
  </div>

</div>

<script>
  function showWaiting(text) {
    document.getElementById("waitingText").innerText = text;
    document.getElementById("waitingDialog").classList.remove("hidden");
    document.getElementById("waitingDialog").classList.add("flex");
  }

  function hideWaiting() {
    document.getElementById("waitingDialog").classList.add("hidden");
    document.getElementById("waitingDialog").classList.remove("flex");
  }

  async function buyProduct(productId, button) {
    // Prevent double-click
    button.disabled = true;
    button.classList.add("opacity-50", "cursor-not-allowed");

    showWaiting("لطفاً مبلغ را در دستگاه کارت‌خوان پرداخت کنید");

    try {
      const res = await fetch("/buy", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: productId })
      });

      const data = await res.json();

      if (res.ok) {
        showWaiting("✅ پرداخت با موفقیت انجام شد");
        setTimeout(hideWaiting, 1500);
      } else {
        showWaiting("❌ پرداخت ناموفق بود");
        setTimeout(hideWaiting, 2000);
      }

    } catch (err) {
      showWaiting("❌ خطا در ارتباط با سرور");
      setTimeout(hideWaiting, 2000);
    } finally {
      button.disabled = false;
      button.classList.remove("opacity-50", "cursor-not-allowed");
    }
  }
</script>

</body>
</html>
